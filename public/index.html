<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>F5 option 2 · KBC voice message PoC</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
</head>
<body>
  <div class="desk">
    <header class="desk-bar">
      <div class="mark" aria-hidden="true">
        <svg viewBox="0 0 32 32" width="22" height="22">
          <circle cx="16" cy="16" r="16" fill="#0097DB"/>
          <path d="M8 20c2.2-4 4.2-6 8-6s5.8 2 8 6" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/>
          <circle cx="16" cy="11" r="2.4" fill="#fff"/>
        </svg>
      </div>
      <div>
        <strong>F5 option 2</strong>
        <span>Voice message instead of the phone queue · blocked account</span>
      </div>
      <button class="ghost" id="deskToggle" type="button">CRM desk</button>
    </header>

    <div class="stage">
      <div class="phone" id="phone">
        <div class="status">
          <span>20:18</span>
          <span class="dots">5G · KBC</span>
        </div>
        <div class="appbar">
          <button class="icon-btn" id="backBtn" type="button" hidden aria-label="Back">←</button>
          <div class="brand">
            <svg viewBox="0 0 28 28" width="22" height="22" aria-hidden="true">
              <circle cx="14" cy="14" r="14" fill="#fff"/>
              <path d="M6.5 18c2-3.6 3.8-5.4 7.5-5.4S19.5 14.4 21.5 18" fill="none" stroke="#0097DB" stroke-width="2" stroke-linecap="round"/>
              <circle cx="14" cy="9.2" r="2.1" fill="#0097DB"/>
            </svg>
            <span>KBC Mobile</span>
          </div>
          <span class="poc-pill">PoC</span>
        </div>

        <main id="screen"></main>

        <nav class="tabbar">
          <button data-tab="home" class="active" type="button"><span>⌂</span>Home</button>
          <button data-tab="pay" type="button"><span>⇄</span>Pay</button>
          <button data-tab="voice" type="button"><span>●</span>Message</button>
          <button data-tab="more" type="button"><span>⋯</span>More</button>
        </nav>
      </div>

      <aside class="crm" id="crmDesk" hidden>
        <h2>Backend CRM</h2>
        <p class="muted">Cases written by <code>POST /api/case</code>. This is the record an agent — or the next automation — would pick up.</p>
        <div id="crmList" class="crm-list"></div>
      </aside>
    </div>
  </div>
  <script src="app.js"></script>
</body>
</html>
